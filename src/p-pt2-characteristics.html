<!DOCTYPE html>
<html lang="ru">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Optom Characteristics Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: prototype toolbar band on top; below it the seller cabinet (sidebar + "Добавить товар" step 3) and a notes column on wide screens.
   Look: Optom.uz seller cabinet from Figma (light, green accent, Inter). Deliberately single light theme: it mirrors the product's own UI. */
:root{
  --page:#f2f3f5; --card:#ffffff; --ink:#111827; --ink-2:#374151; --muted:#6b7280; --line:#e5e7eb; --line-2:#d1d5db; --soft:#f6f7f9;
  --green:#2f9e44; --green-ink:#237a35; --green-50:#ecf7ee; --green-200:#a9dcb3;
  --red:#d92d20; --red-50:#fef3f2; --amber:#b54708; --amber-50:#fffaeb; --blue:#175cd3; --blue-50:#eff6ff;
  --bar:#1f2937; --bar-ink:#e5e7eb; --bar-muted:#9ca3af;
  --font:"Inter",-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--page);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--green);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}

/* prototype toolbar */
.pbar{background:var(--bar);color:var(--bar-ink);padding-block:10px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center}
.pbar b{font-weight:600}
.pbar .tag{font-size:12px;color:var(--bar-muted)}
.pbar select{background:#111827;color:var(--bar-ink);border:1px solid #374151;border-radius:8px;padding:6px 10px;max-width:100%}
.pbar button{background:transparent;color:var(--bar-ink);border:1px solid #374151;border-radius:8px;padding:6px 12px;cursor:pointer}
.pbar button:hover{border-color:#6b7280}

/* page grid */
.wrap{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;padding-block:16px 40px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
@media (min-width:1700px){.wrap{grid-template-columns:minmax(0,1fr) 330px;align-items:start}}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);gap:16px;min-width:0}
@media (max-width:900px){.app{grid-template-columns:minmax(0,1fr)}.side{display:none}}

/* sidebar */
.side{background:transparent;display:flex;flex-direction:column;gap:4px;padding-top:4px}
.logo{display:flex;align-items:center;gap:8px;font-size:26px;font-weight:600;letter-spacing:-.02em;margin:0 0 18px 8px}
.logo i{width:28px;height:28px;border-radius:7px;background:repeating-linear-gradient(0deg,var(--green) 0 5px,transparent 5px 8px);display:inline-block}
.side h6{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 8px 4px;font-weight:600}
.nav{padding:9px 12px;border-radius:10px;color:var(--ink-2);display:flex;gap:10px;align-items:center}
.nav.on{background:var(--card);color:var(--ink);font-weight:500;box-shadow:0 1px 2px rgba(17,24,39,.06)}
.nav span{width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.35}
.nav.on span{background:var(--green);opacity:1}

/* main */
.main{min-width:0;display:flex;flex-direction:column;gap:14px}
.crumbs{display:flex;align-items:center;gap:8px;color:var(--muted)}
.crumbs b{color:var(--ink);font-weight:500}
.panel{background:var(--card);border-radius:16px;box-shadow:0 1px 2px rgba(17,24,39,.05);min-width:0}
.phead{padding:20px 24px;border-bottom:1px solid var(--line)}
.phead h1{font-size:22px;font-weight:600;margin:0 0 2px;letter-spacing:-.01em}
.phead p{margin:0;color:var(--muted)}
.steps{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px;padding:20px 24px;border-bottom:1px solid var(--line);overflow-x:auto}
.st{display:flex;flex-direction:column;gap:6px;min-width:110px}
.st .dot{display:flex;align-items:center}
.st .dot i{width:22px;height:22px;border-radius:50%;border:2px solid var(--line-2);background:var(--card);display:grid;place-items:center;font-style:normal;font-size:12px;color:#fff;flex:none}
.st .dot u{flex:1;height:2px;background:var(--line);margin-left:6px}
.st.done .dot i{background:var(--green);border-color:var(--green)}
.st.done .dot u{background:var(--green)}
.st.cur .dot i{border-color:var(--green);box-shadow:0 0 0 3px var(--green-50);background:radial-gradient(var(--green) 0 4px,var(--card) 5px)}
.st b{font-weight:500;font-size:13px}
.st.cur b,.st.cur small{color:var(--green-ink)}
.st small{color:var(--muted);font-size:12px;line-height:1.35}

.body{display:grid;grid-template-columns:200px minmax(0,1fr);gap:24px;padding:24px}
@media (max-width:1250px){.body{grid-template-columns:minmax(0,1fr)}}
.lab h3{margin:0 0 2px;font-size:14px;font-weight:600}
.lab p{margin:0;color:var(--muted)}
.lab .hint{margin-top:14px;padding:10px 12px;border-radius:10px;background:var(--soft);color:var(--ink-2);font-size:12.5px}
.content{min-width:0;display:flex;flex-direction:column;gap:16px}

/* type cards */
.types{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
@media (max-width:700px){.types{grid-template-columns:minmax(0,1fr)}}
.tcard{border:1px solid var(--line-2);border-radius:12px;padding:12px 14px;text-align:left;background:var(--card);cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 10px}
.tcard b{font-weight:600}
.tcard small{color:var(--muted);grid-column:1}
.tcard .rad{grid-row:1/3;grid-column:2;align-self:center;width:18px;height:18px;border-radius:50%;border:1.6px solid var(--line-2)}
.tcard.on{background:var(--green-50);border-color:var(--green-200)}
.tcard.on small{color:var(--green-ink)}
.tcard.on .rad{border-color:var(--green);background:radial-gradient(var(--green) 0 4px,#fff 5px)}

.box{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:16px;min-width:0}
.seg{display:inline-flex;background:var(--soft);border-radius:10px;padding:3px;gap:2px;align-self:flex-start;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:7px 16px;border-radius:8px;cursor:pointer;color:var(--ink-2)}
.seg button.on{background:var(--card);box-shadow:0 1px 2px rgba(17,24,39,.12);color:var(--ink);font-weight:500}
.seg.sm button{padding:5px 12px;font-size:13px}

.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 16px}
@media (max-width:700px){.grid2{grid-template-columns:minmax(0,1fr)}}
.f{display:flex;flex-direction:column;gap:6px;min-width:0}
.f > label,.flab{font-weight:500;font-size:13.5px}
.f .sub{color:var(--muted);font-size:12px}
.inp{display:flex;border:1px solid var(--line-2);border-radius:10px;background:var(--card);overflow:hidden;min-width:0}
.inp input{border:0;outline:0;padding:10px 12px;min-width:0;width:100%;flex:1;background:transparent;font-variant-numeric:tabular-nums}
.inp:focus-within{border-color:var(--green);box-shadow:0 0 0 3px var(--green-50)}
.inp .suf{padding:0 12px;display:flex;align-items:center;border-left:1px solid var(--line);color:var(--ink-2);background:var(--soft);font-weight:500;white-space:nowrap}
.inp select{border:0;border-left:1px solid var(--line);background:var(--soft);padding:0 10px;font-weight:600;cursor:pointer}
.inp.ro{background:var(--soft)}
.inp.ro input{color:var(--muted)}
.f.bad .inp,.inp.bad{border-color:var(--red);box-shadow:0 0 0 3px var(--red-50)}
.err{color:var(--red);font-size:12px;min-height:0}
.err:empty{display:none}
select.plain{border:1px solid var(--line-2);border-radius:10px;padding:10px 12px;background:var(--card);min-width:0}

.btn{border:1px solid var(--line-2);background:var(--card);border-radius:10px;padding:9px 14px;cursor:pointer;font-weight:500;display:inline-flex;gap:6px;align-items:center;white-space:nowrap}
.btn:hover{border-color:#9ca3af}
.btn.pri{background:var(--green);border-color:var(--green);color:#fff}
.btn.pri:hover{background:var(--green-ink)}
.btn.soft{background:var(--green-50);border-color:transparent;color:var(--green-ink)}
.btn.ghost{border-color:transparent;background:transparent;color:var(--green-ink);padding:6px 8px}
.btn.danger{color:var(--red)}
.btn.sm{padding:6px 10px;font-size:13px;border-radius:8px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.spacer{flex:1}

.note{border-radius:10px;padding:10px 12px;font-size:13px;display:flex;gap:8px}
.note.info{background:var(--blue-50);color:#1e3a8a}
.note.warn{background:var(--amber-50);color:#7a2e0b}
.note.ok{background:var(--green-50);color:var(--green-ink)}
.note.prop{border:1px dashed #c4b5fd;background:#faf7ff;color:#4c1d95}
.flag{display:inline-block;font-size:11px;font-weight:600;padding:1px 6px;border-radius:6px;background:#ede9fe;color:#5b21b6;vertical-align:1px}

/* error banner */
.ebanner{border:1px solid #fecdca;background:var(--red-50);border-radius:12px;padding:12px 14px;display:flex;flex-direction:column;gap:6px}
.ebanner b{color:var(--red)}
.ebanner ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:3px}
.ebanner a{color:var(--ink);text-decoration:underline;cursor:pointer}

/* inner stepper for Разная цена */
.istep{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.istep button{border:0;background:transparent;display:flex;gap:8px;align-items:center;padding:6px 10px 6px 6px;border-radius:999px;cursor:pointer;color:var(--muted)}
.istep button i{width:22px;height:22px;border-radius:50%;display:grid;place-items:center;font-style:normal;font-size:12px;font-weight:600;background:var(--soft);color:var(--muted)}
.istep button.on{background:var(--green-50);color:var(--green-ink);font-weight:500}
.istep button.on i{background:var(--green);color:#fff}
.istep button.done i{background:var(--green-200);color:var(--green-ink)}
.istep button:disabled{cursor:default;opacity:.55}
.istep .sep{width:18px;height:1px;background:var(--line-2)}

/* characteristics */
.char{border:1px solid var(--line);border-radius:12px;padding:14px;display:flex;flex-direction:column;gap:10px}
.char.on{border-color:var(--green-200);background:#fbfefb}
.char head{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.char head label{display:flex;gap:8px;align-items:center;font-weight:600;cursor:pointer}
.char head small{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:1px solid var(--line-2);border-radius:999px;padding:6px 12px;background:var(--card);cursor:pointer;display:inline-flex;gap:7px;align-items:center}
.chip.on{border-color:var(--green);background:var(--green-50);color:var(--green-ink);font-weight:500}
.chip.on::after{content:"✓";font-size:12px}
.sw{width:14px;height:14px;border-radius:50%;border:1px solid rgba(0,0,0,.15);display:inline-block;flex:none}
.combo{display:flex;flex-wrap:wrap;align-items:center;gap:10px;padding:12px 14px;border-radius:12px;background:var(--soft)}
.combo b{font-size:20px;font-variant-numeric:tabular-nums}
input[type=checkbox]{width:16px;height:16px;accent-color:var(--green);cursor:pointer;margin:0}

/* progress */
.prog{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.prog .bar{width:160px;max-width:100%;height:6px;background:var(--line);border-radius:3px;overflow:hidden}
.prog .bar span{display:block;height:100%;background:var(--green)}
.prog small{color:var(--muted)}

/* variant table */
.tscroll{overflow-x:auto;border:1px solid var(--line);border-radius:12px}
table.vt{border-collapse:separate;border-spacing:0;width:100%;min-width:720px}
table.vt.cmp{min-width:600px}
.vt th{font-size:12px;font-weight:500;color:var(--muted);text-align:left;padding:9px 10px;background:var(--soft);border-bottom:1px solid var(--line);white-space:nowrap}
.vt td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:middle}
.vt tr:last-child td{border-bottom:0}
.vt tr.grp td{background:#fafbfa;padding:9px 10px}
.vt tr.grp b{font-weight:600}
.vt tr.off td{background:#fafafa;color:var(--muted)}
.vt tr.off .vname{text-decoration:line-through}
.vt tr.sel td{background:#f3faf4}
.vt .inp input{padding:7px 9px;width:100%}
.vt .inp .suf{padding:0 8px;font-size:12.5px}
.vt .w-price{width:190px}.vt .w-moq{width:120px}
.vname{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.vtag{display:inline-flex;gap:6px;align-items:center;border-radius:7px;background:var(--soft);padding:3px 8px;font-size:13px;white-space:nowrap}
.num{font-variant-numeric:tabular-nums;white-space:nowrap}
.eq{font-size:11.5px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.tog{position:relative;width:34px;height:20px;border-radius:10px;background:var(--line-2);border:0;cursor:pointer;flex:none}
.tog::after{content:"";position:absolute;top:2px;left:2px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .15s}
.tog.on{background:var(--green)}
.tog.on::after{left:16px}
.ginp{display:flex;gap:6px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px}
.ginp .inp{width:150px}
.ginp .inp input{padding:6px 8px}

.bulk{position:sticky;bottom:10px;z-index:3;background:var(--bar);color:var(--bar-ink);border-radius:12px;padding:10px 12px;display:flex;flex-wrap:wrap;gap:8px;align-items:center;box-shadow:0 8px 24px rgba(17,24,39,.25)}
.bulk .inp{width:150px;border-color:#374151;background:#111827}
.bulk .inp input{color:#fff;padding:7px 9px}
.bulk .inp .suf{background:#1f2937;border-color:#374151;color:var(--bar-ink)}
.bulk .btn{background:#374151;border-color:#374151;color:#fff}
.bulk .btn.pri{background:var(--green);border-color:var(--green)}

/* matrix */
table.mx{border-collapse:separate;border-spacing:0;min-width:640px;width:100%}
.mx th,.mx td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:8px;min-width:150px}
.mx tr > *:last-child{border-right:0}
.mx tr:last-child > *{border-bottom:0}
.mx thead th{background:var(--soft);font-weight:500;text-align:left;vertical-align:top}
.mx tbody th{background:#fafbfa;text-align:left;font-weight:600;white-space:nowrap;vertical-align:top}
.mx .hd{display:flex;gap:6px;align-items:center;margin-bottom:6px}
.mx .mini{display:flex;gap:4px}
.mx .mini .inp{flex:1}
.mx .mini .inp input{padding:5px 7px;font-size:12.5px}
.mx td .cell{display:flex;gap:4px;align-items:center}
.mx td .inp input{padding:7px 8px}
.mx td.off{background:repeating-linear-gradient(135deg,#f6f7f9 0 6px,#eef0f3 6px 12px);color:var(--muted);font-size:12.5px}
.xbtn{border:0;background:transparent;color:var(--muted);cursor:pointer;width:24px;height:24px;border-radius:6px;flex:none}
.xbtn:hover{background:var(--soft);color:var(--red)}
.linkbtn{border:0;background:transparent;color:var(--green-ink);cursor:pointer;padding:0;text-decoration:underline;font-size:12.5px}
.tabs{display:flex;gap:6px;flex-wrap:wrap}

/* review */
.rv{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
@media (max-width:760px){.rv{grid-template-columns:minmax(0,1fr)}}
.stats{grid-template-columns:repeat(2,minmax(0,1fr))}
.stats{display:grid;gap:10px}
.stat{border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stat small{color:var(--muted);display:block}
.stat b{font-size:17px;font-variant-numeric:tabular-nums}
.warns{display:flex;flex-direction:column;gap:6px}

/* buyer preview */
.pv{border:1px solid var(--line);border-radius:14px;padding:14px;display:flex;flex-direction:column;gap:12px;background:var(--card)}
.pv .eyb{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.pimg{aspect-ratio:4/3;max-width:100%;border-radius:10px;background:linear-gradient(160deg,#eef1f4,#e3e7ec);display:grid;place-items:center}
.pimg i{width:64px;height:118px;border-radius:12px;background:linear-gradient(170deg,#3b4252,#1f2430);box-shadow:inset 0 0 0 3px #575f70}
.pv h4{margin:0;font-size:15px;font-weight:600}
.pprice{font-size:22px;font-weight:700;font-variant-numeric:tabular-nums}
.pprice s{font-size:14px;font-weight:400;color:var(--muted);margin-left:6px}
.popt{display:flex;flex-direction:column;gap:6px}
.popt small{color:var(--muted)}
.popt .chips .chip{padding:5px 10px;font-size:13px}
.chip.dis{opacity:.45;text-decoration:line-through;cursor:not-allowed}
.chip.pick{border-color:var(--ink);font-weight:600}
.tierlist{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:10px;overflow:hidden}
.tierlist div{display:flex;justify-content:space-between;padding:7px 10px;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.tierlist div:last-child{border-bottom:0}
.tierlist .hit{background:var(--green-50);font-weight:600}

/* tiers */
.tiers{display:flex;flex-direction:column;gap:8px}
.tier{display:grid;grid-template-columns:28px minmax(0,1fr) 18px minmax(0,1fr) minmax(0,1.4fr) 92px 32px;gap:8px;align-items:start}
@media (max-width:760px){.tier{grid-template-columns:28px minmax(0,1fr) minmax(0,1fr);}.tier .dash,.tier .sv{display:none}.tier .tp{grid-column:2/4}.tier .td{grid-column:3}}
.tier .no{width:28px;height:38px;display:grid;place-items:center;color:var(--muted);font-weight:600}
.tier .dash{height:38px;display:grid;place-items:center;color:var(--muted)}
.tier .sv{height:38px;display:flex;align-items:center}
.save{font-size:12px;font-weight:600;color:var(--green-ink);background:var(--green-50);border-radius:6px;padding:2px 7px}
.tierhead{display:grid;grid-template-columns:28px minmax(0,1fr) 18px minmax(0,1fr) minmax(0,1.4fr) 92px 32px;gap:8px;color:var(--muted);font-size:12px}
@media (max-width:760px){.tierhead{display:none}}
.ladder{display:flex;height:34px;border-radius:8px;overflow:hidden;border:1px solid var(--line)}
.ladder div{display:flex;align-items:center;justify-content:center;font-size:12px;font-variant-numeric:tabular-nums;border-right:1px solid #fff;white-space:nowrap;overflow:hidden;padding:0 4px}
.calc{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--soft)}
.calc .inp{width:110px}

.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding:16px 24px;border-top:1px solid var(--line)}

/* modal + toast */
.scrim{position:fixed;inset:0;background:rgba(17,24,39,.45);display:grid;place-items:center;z-index:20;padding:16px}
.modal{background:var(--card);border-radius:16px;max-width:460px;width:100%;padding:20px;display:flex;flex-direction:column;gap:12px}
.modal h3{margin:0;font-size:17px}
.modal ul{margin:0;padding-left:18px;color:var(--ink-2);display:flex;flex-direction:column;gap:4px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(20px + env(safe-area-inset-bottom,0px));background:var(--bar);color:#fff;padding:10px 16px;border-radius:10px;z-index:30;max-width:calc(100% - 32px)}

/* notes */
.notes{background:var(--card);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px;min-width:0}
@media (min-width:1700px){.notes{position:sticky;top:16px;max-height:calc(100vh - 32px);overflow:auto}}
.notes h2{margin:0;font-size:15px}
.notes .eyb{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600}
.notes ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2);font-size:13px}
.notes p{margin:0;font-size:13px;color:var(--ink-2)}
</style>

<style>
/* P-PT2 additions: admin panel tables, value editor, sellers' own values report, own-value chips, buyer filter view. Same tokens as P-PT1. */
.side .badge{margin-left:auto;background:var(--red);color:#fff;border-radius:999px;font-size:11px;font-weight:600;padding:1px 7px;line-height:1.5}
.side .sub{padding-left:28px;font-size:13px}
.atop{display:flex;justify-content:flex-end;gap:10px;align-items:center;color:var(--ink-2);font-size:13px}

function reportRows(){
  var map={},rows=[];
  function add(field,ru,sellers,products,link,mine){var k=field+"|"+norm(ru);if(!map[k]){map[k]={field:field,ru:ru,sellers:0,products:0,links:{},mine:false};rows.push(map[k]);}
    var r=map[k];r.sellers+=sellers;r.products+=products;if(link)r.links[link]=(r.links[link]||0)+sellers;if(mine)r.mine=true;}
  D.others.forEach(function(o){add(o.field,o.ru,o.sellers,o.products,o.link,false);});
  D.own.forEach(function(o){add(o.field,o.ru,1,o.used,o.link,true);});
  rows.forEach(function(r){var best=null,n=0;Object.keys(r.links).forEach(function(l){if(r.links[l]>n){n=r.links[l];best=l;}});r.link=best;r.linkN=n;});
  rows.sort(function(a,b){return b.sellers-a.sellers||b.products-a.products;});
  return rows;
}

  if(a==="uzOpen"){M.uzOpen=true;renderLayer();focusIn("#in-uz");return;}
  if(a==="aLinkTo"){M.link=v;renderLayer();return;}
  if(a==="aPick"){var fpk=M.field,ar=S.sel[fpk]||(S.sel[fpk]=[]);S.open[fpk]=true;if(ar.indexOf(v)<0)ar.push(v);S.justAdded=v;U.modal=null;render();toast("Выбрано существующее значение");return;}
  if(a==="sAddOk"){M.showErr=true;var R=addErr(M);if(R.err){renderLayer();focusIn("#in-sv");return;}
    if(M.editId){var oe=D.own.filter(function(o){return o.id===M.editId;})[0];oe.ru=M.text.trim();oe.uz=M.uz.trim();oe.link=M.link||null;if(M.field==="color")oe.c=M.c;U.modal={kind:"myVals"};render();toast("Сохранено во всех ваших товарах ("+oe.used+")");return;}
    var nid="u"+(100+D.nextId++);D.own.push({id:nid,field:M.field,ru:M.text.trim(),uz:M.uz.trim(),c:M.field==="color"?M.c:null,link:M.link||null,used:0});
    (S.sel[M.field]||(S.sel[M.field]=[])).push(nid);S.open[M.field]=true;S.justAdded=nid;U.modal=null;render();toast("Своё значение добавлено. Его видите только вы — в любом своём товаре.");return;}
  if(a==="myVals"){U.modal={kind:"myVals"};renderLayer();return;}
  if(a==="ownEdit"){var o2=D.own.filter(function(o){return o.id===v;})[0];U.modal={kind:"sAdd",field:o2.field,text:o2.ru,uz:o2.uz,uzOpen:!!o2.uz,link:o2.link||"",c:o2.c||"#888888",showErr:false,editId:o2.id};renderLayer();focusIn("#in-sv");return;}
  if(a==="ownDel"){D.own=D.own.filter(function(o){return o.id!==v;});Object.keys(S.sel).forEach(function(k){var s=S.sel[k],ix2=s.indexOf(v);if(ix2>-1)s.splice(ix2,1);});render();toast("Значение удалено");return;}
  if(a==="sContinue"){var cc=sCount();if(cc<2){toast("Выберите значения хотя бы для двух вариантов");return;}toast("Дальше — шаг 2 «Цены» (см. P-PT1). Вариантов: "+cc);return;}
  /* buyer */
  if(a==="bCol"){var bc=U.buyer.color,bi=bc.indexOf(v);if(bi>-1)bc.splice(bi,1);else bc.push(v);render();return;}
  if(a==="bReset"){U.buyer.color=[];render();return;}
});

    return;}

  if(k==="m.q"){M.q=t.value;var p4=t.selectionStart;renderLayer();keepFocus('[data-k="m.q"]',p4);return;}

});
